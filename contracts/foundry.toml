[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
hsk = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

[etherscan]
hsk = { key = "blockscout", url = "https://hsk.blockscout.com/api/", chain = 177 }
hsk_testnet = { key = "blockscout", url = "https://testnet-explorer.hskchain.net/api/", chain = 133 }

[fmt]
line_length = 110
